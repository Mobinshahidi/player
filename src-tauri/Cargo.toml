[package]
name = "player-gui"
version = "0.1.0"
description = "Local-first desktop GUI for the player"
authors = ["player"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "player_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
